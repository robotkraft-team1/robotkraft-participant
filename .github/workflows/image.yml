name: Image Docker

# Construit l'image des equipes et la publie sur ghcr.io.
# Deux runners natifs (pas d'emulation QEMU, qui rend l'installation de torch
# interminable), puis un manifeste multi-arch qui reunit les deux.

on:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile
      - pyproject.toml
      - uv.lock
      - scripts/**
      - urdf/**
      - .github/workflows/image.yml
  workflow_dispatch:

env:
  # ghcr exige des minuscules, or l'organisation s'ecrit AlsaceDigitale
  IMAGE: ghcr.io/alsacedigitale/robotkraft

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            variante: cpu
          - runner: ubuntu-24.04-arm
            arch: arm64
            variante: cpu
          # CUDA n'existe pas sur ARM, cette variante est donc amd64 seulement
          - runner: ubuntu-latest
            arch: amd64
            variante: cuda
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # La pile CUDA (torch, cuDNN, cuBLAS, NCCL, triton) depasse l'espace
      # disponible sur le runner amd64. On evacue les SDK preinstalles.
      - name: Liberer de l'espace disque
        if: matrix.variante == 'cuda'
        run: |
          echo "avant : $(df -h / | awk 'NR==2{print $4}') libres"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "apres : $(df -h / | awk 'NR==2{print $4}') libres"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le cache est porte par la registry : une modification de uv.lock ne
      # retelecharge que les paquets reellement changes.
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            VARIANTE=${{ matrix.variante }}
          tags: ${{ env.IMAGE }}:${{ matrix.variante }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.variante }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.variante }}-${{ matrix.arch }},mode=max

      - name: Taille de l'image
        run: |
          T="${{ matrix.variante }}-${{ matrix.arch }}"
          docker pull "$IMAGE:$T"
          docker image inspect "$IMAGE:$T" --format '{{.Size}}' \
            | awk -v t="$T" '{printf "  %s : %.2f Go\n", t, $1/1024/1024/1024}'

      - name: Verifier que l'image fonctionne
        run: .github/test-image.sh "$IMAGE:${{ matrix.variante }}-${{ matrix.arch }}" "${{ matrix.variante }}"

  manifeste:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reunir les architectures sous des references uniques
        run: |
          # latest : la variante legere, celle que tirent les equipes
          docker buildx imagetools create -t "$IMAGE:latest" \
            "$IMAGE:cpu-amd64" "$IMAGE:cpu-arm64"
          # cuda : amd64 uniquement, pour le serveur et les portables NVIDIA
          docker buildx imagetools create -t "$IMAGE:cuda" "$IMAGE:cuda-amd64"
          echo "== latest"; docker buildx imagetools inspect "$IMAGE:latest"
          echo "== cuda";   docker buildx imagetools inspect "$IMAGE:cuda"
