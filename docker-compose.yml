services:
  lerobot-base:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    image: ${ROBOTKRAFT_IMAGE:-ghcr.io/alsacedigitale/robotkraft:latest}
    volumes:
      - ./datasets:/workspace/datasets
      - ./scripts:/workspace/scripts
      - ./outputs:/workspace/outputs
      - .cache:/workspace/.cache
      - uv-cache:/opt/uv-cache
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    shm_size: '2gb'
    stdin_open: true
    tty: true

  lerobot:
    extends:
      service: lerobot-base
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      # privileged expose tous les /dev/ttyACM* de l'hôte sous leur nom, et Docker IGNORE alors la
      # section devices: (un mapping /dev/lerobot_follower:/dev/ttyACM0 n'a aucun effet). Le vrai
      # port de chaque bras est donc résolu sur l'hôte depuis les symlinks udev (mk/robot.mk).
      - FOLLOWER_PORT=${FOLLOWER_PORT:-/dev/ttyACM0}
      - LEADER_PORT=${LEADER_PORT:-/dev/ttyACM1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /dev/bus/usb:/dev/bus/usb

  # Comme lerobot (robot + caméras) avec accès au GPU, pour make eval en variante CUDA
  lerobot-robot-gpu:
    extends:
      service: lerobot
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  lerobot-camera:
    extends:
      service: lerobot-base
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb

  lerobot-follower:
    extends:
      service: lerobot-base
    devices:
      - ${FOLLOWER_DEV:-/dev/ttyACM0}:/dev/ttyACM0 # follower seul : symlink udev si présent (voir mk/robot.mk), sinon ttyACM0

  lerobot-leader:
    extends:
      service: lerobot-base
    devices:
      - ${LEADER_DEV:-/dev/ttyACM1}:/dev/ttyACM1 # leader seul : symlink udev si présent (voir mk/robot.mk), sinon ttyACM1

  lerobot-gpu:
    extends:
      service: lerobot-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  uv-cache:
